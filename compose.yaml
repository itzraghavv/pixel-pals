name: pixel-pals
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pals
      POSTGRES_PASSWORD: pals
      POSTGRES_DB: pals
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pals']
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: [minio-data:/data]
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
        mc mb --ignore-existing local/pixel-pals &&
        mc anonymous set download local/pixel-pals
  migrate:
    build:
      context: backend
      target: cli
    entrypoint: ['/palsctl', 'migrate']
    environment:
      DATABASE_URL: postgres://pals:pals@postgres:5432/pals?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build:
      context: backend
      target: api
    environment:
      HTTP_PORT: '8080'
      APP_ENV: development
      DATABASE_URL: postgres://pals:pals@postgres:5432/pals?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random secret of at least 32 bytes}
      COMPAT_V0: 'true'
      ALLOW_ADMIN_SIGNUP: 'false'
      CORS_ORIGINS: http://localhost:3000
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: pixel-pals
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_PUBLIC_URL: http://localhost:9000/pixel-pals
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
  realtime:
    build:
      context: backend
      target: realtime
    environment:
      REALTIME_PORT: '8081'
      DATABASE_URL: postgres://pals:pals@postgres:5432/pals?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random secret of at least 32 bytes}
      COMPAT_V0: 'true'
      CORS_ORIGINS: http://localhost:3000
      ALLOW_TILE_OVERLAP: 'true'
      PROXIMITY_RADIUS: '3'
    ports: ['127.0.0.1:8081:8081']
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
volumes:
  postgres-data:
  minio-data:
